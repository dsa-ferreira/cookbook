[project]
name = "cookbook"
version = "0.1.0"
description = "Recipe store served as an MCP server for AI assistants"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2,<3",
    "alembic",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings",
    "mcp>=2.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
cookbook = "cookbook.cli:run"

[dependency-groups]
dev = [
    "pytest",
    "testcontainers[postgres]",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
